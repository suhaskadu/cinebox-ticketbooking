<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="cineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="ticketGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Film / Ticket Icon -->
  <g transform="translate(6, 8)">
    <rect x="0" y="2" width="44" height="40" rx="8" fill="url(#ticketGradient)" filter="url(#glow)"/>
    <!-- Film Perforations -->
    <rect x="5" y="6" width="6" height="6" rx="1.5" fill="#0B0F19"/>
    <rect x="5" y="16" width="6" height="6" rx="1.5" fill="#0B0F19"/>
    <rect x="5" y="26" width="6" height="6" rx="1.5" fill="#0B0F19"/>
    <rect x="5" y="32" width="6" height="6" rx="1.5" fill="#0B0F19"/>

    <rect x="33" y="6" width="6" height="6" rx="1.5" fill="#0B0F19"/>
    <rect x="33" y="16" width="6" height="6" rx="1.5" fill="#0B0F19"/>
    <rect x="33" y="26" width="6" height="6" rx="1.5" fill="#0B0F19"/>
    <rect x="33" y="32" width="6" height="6" rx="1.5" fill="#0B0F19"/>

    <!-- Play triangle / Cinema mark in center -->
    <polygon points="19,15 30,22 19,29" fill="#FFFFFF"/>
  </g>

  <!-- CineBook Brand Text -->
  <text x="62" y="35" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5" fill="#FFFFFF">
    CINE<tspan fill="url(#cineGradient)">BOOK</tspan>
  </text>
  
  <!-- Mini Project Subtitle -->
  <text x="64" y="49" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="2.5" fill="#94A3B8">
    DATA STRUCTURES PROJECT
  </text>
</svg>
